<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LTE tracker controls</title>
    <style>
        :root {
            font: 100%/1.5 "Segoe UI", sans-serif;
            color: #19232d;
            background: #f6f7f8;
        }

        * {
            box-sizing: border-box;
        }

        main {
            max-width: 40rem;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        h1 {
            font-size: 1.75rem;
        }

        h2 {
            margin: 0 0 .75rem;
            font-size: 1.125rem;
        }

        section, details {
            background: white;
            border: 1px solid #cbd0d5;
            border-radius: .4rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
        }

        button, input {
            font: inherit;
            padding: .45rem .75rem;
        }

        button {
            cursor: pointer;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
        }

        label {
            display: grid;
            gap: .25rem;
            margin: .75rem 0;
        }

        input {
            width: 100%;
            min-width: 0;
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0;
            min-width: 0;
        }

        output {
            display: block;
            margin-top: .75rem;
            overflow-wrap: anywhere;
        }
    </style>
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>LTE tracker controls</h1>
        <section aria-labelledby="commands">
            <h2 id="commands">Board commands</h2>
            <div class="buttons" id="command-buttons">
                <button type="button" data-command="ping">
                    Ping
                </button>
                <button type="button" data-command="status">
                    Get status
                </button>
                <button type="button" data-command="location">
                    Get location
                </button>
            </div>
            <output id="result">
                Offline preview. Connect to HiveMQ to send commands.
            </output>
        </section>
        <details>
            <summary>HiveMQ connection</summary>
            <form id="connection">
                <fieldset id="settings">
                    <label>
                        WebSocket URL
                        <input id="broker" type="url" pattern="wss://.+"
                            placeholder="wss://cluster.hivemq.cloud:8884/mqtt"
                            required
                        >
                    </label>
                    <label>
                        Command topic
                        <input
                            id="topic"
                            value="efs-lte-tracker/commands"
                            required
                        >
                    </label>
                    <label>
                        Username
                        <input id="username" autocomplete="username">
                    </label>
                    <label>
                        Password
                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                        >
                    </label>
                </fieldset>
                <button id="toggle" type="submit">Connect</button>
                <output id="status">Disconnected</output>
            </form>
        </details>
    </main>
</body>
</html>
